services:
  - type: web
    name: collab-whiteboard
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      # devDependencies (vite, typescript, tsx) are needed during build.
      # Render sets NODE_ENV=production by default, which makes npm skip them
      # unless we explicitly override:
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
